<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="MDOnline - Markdown docs site" />
  <title>MDOnline - Markdown docs site</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./vue.css" />
  <link rel="stylesheet" href="./style.css" />
  <script>
    (function () {
      var path = window.location.pathname;
      window.$$docsifyBasePath = path.replace(/(?:\/index\.html)?\/?$/, '/') || '/';
    })();

    window.$docsify = {
      name: 'MDOnline',
      basePath: window.$$docsifyBasePath,
      homepage: 'docs/README.md',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      coverpage: false,
      onlyCover: false,
      search: {
        paths: 'auto',
        maxAge: 0,
        depth: 4,
        noData: '\u6ca1\u6709\u627e\u5230\u76f8\u5173\u5185\u5bb9',
        placeholder: '\u641c\u7d22\u63a5\u53e3\u3001\u6d41\u7a0b\u3001\u72b6\u6001\u7801'
      },
      plugins: [
        function collapsibleSidebar(hook) {
          hook.doneEach(function () {
            document.querySelectorAll('.sidebar-nav li').forEach(function (item) {
              var childList = item.querySelector(':scope > ul');
              var trigger = item.querySelector(':scope > p, :scope > a');
              if (!childList || !trigger || trigger.dataset.collapseBound === 'true') { return; }
              trigger.dataset.collapseBound = 'true';
              trigger.classList.add('sidebar-collapse-trigger');
              trigger.setAttribute('role', 'button');
              trigger.setAttribute('tabindex', '0');
              trigger.addEventListener('click', function (event) {
                event.preventDefault();
                item.classList.toggle('sidebar-group-collapsed');
              });
              trigger.addEventListener('keydown', function (event) {
                if (event.key === 'Enter' || event.key === ' ') {
                  event.preventDefault();
                  item.classList.toggle('sidebar-group-collapsed');
                }
              });
            });
          });
        },

        // --- Action bar: Star + Donate ---
        function actionBarPlugin(hook) {
          var STAR_URL = 'https://github.com/xianyuxm/MDOnline';
          hook.mounted(function () {
            var bar = document.createElement('div');
            bar.id = 'action-bar';

            var starBtn = document.createElement('a');
            starBtn.id = 'action-star';
            starBtn.href = STAR_URL;
            starBtn.target = '_blank';
            starBtn.rel = 'noopener';
            starBtn.title = 'Star on GitHub';
            starBtn.innerHTML = '<svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor"><path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/></svg><span>Star</span>';
            bar.appendChild(starBtn);

            var donateBtn = document.createElement('button');
            donateBtn.id = 'action-donate';
            donateBtn.title = 'Buy me a coffee';
            donateBtn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span>Sponsor</span>';
            bar.appendChild(donateBtn);
            document.body.appendChild(bar);

            var modal = document.createElement('div');
            modal.id = 'donate-modal';
            modal.innerHTML =
              '<div class="donate-overlay"></div>' +
              '<div class="donate-content">' +
                '<button class="donate-close">&times;</button>' +
                '<h3>' + '\u611f\u8c22\u60a8\u7684\u652f\u6301\uff01' + '</h3>' +
                '<div class="donate-cards">' +
                  '<div class="donate-card">' +
                    '<img src="./images/wechat-pay.png" alt="' + '\u5fae\u4fe1\u652f\u4ed8' + '" />' +
                    '<p>' + '\u5fae\u4fe1\u652f\u4ed8' + '</p>' +
                  '</div>' +
                  '<div class="donate-card">' +
                    '<img src="./images/alipay.png" alt="' + '\u652f\u4ed8\u5b9d' + '" />' +
                    '<p>' + '\u652f\u4ed8\u5b9d' + '</p>' +
                  '</div>' +
                '</div>' +
              '</div>';
            document.body.appendChild(modal);

            var lightbox = document.createElement('div');
            lightbox.id = 'img-lightbox';
            lightbox.innerHTML =
              '<div class="lightbox-overlay"></div>' +
              '<img class="lightbox-img" src="" alt="" />' +
              '<button class="lightbox-close">&times;</button>';
            document.body.appendChild(lightbox);

            donateBtn.addEventListener('click', function () { modal.classList.add('open'); });
            modal.querySelector('.donate-overlay').addEventListener('click', function () { modal.classList.remove('open'); });
            modal.querySelector('.donate-close').addEventListener('click', function () { modal.classList.remove('open'); });
            document.addEventListener('keydown', function (e) {
              if (e.key === 'Escape') {
                if (lightbox.classList.contains('open')) { lightbox.classList.remove('open'); }
                else { modal.classList.remove('open'); }
              }
            });

            modal.querySelectorAll('.donate-card img').forEach(function (img) {
              img.style.cursor = 'zoom-in';
              img.addEventListener('click', function () {
                lightbox.querySelector('.lightbox-img').src = img.src;
                lightbox.querySelector('.lightbox-img').alt = img.alt;
                lightbox.classList.add('open');
              });
            });
            lightbox.querySelector('.lightbox-overlay').addEventListener('click', function () { lightbox.classList.remove('open'); });
            lightbox.querySelector('.lightbox-close').addEventListener('click', function () { lightbox.classList.remove('open'); });
          });
        },

        // --- Sidebar refresh button ---
        function sidebarRefreshPlugin(hook) {
          hook.mounted(function () {
            var btn = document.createElement('button');
            btn.id = 'sidebar-refresh';
            btn.title = 'Regenerate sidebar';
            btn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>';
            document.body.appendChild(btn);
            btn.addEventListener('click', function () {
              btn.classList.add('spinning');
              fetch('/__refresh')
                .then(function (res) { return res.text(); })
                .then(function () {
                  setTimeout(function () { btn.classList.remove('spinning'); location.reload(); }, 400);
                })
                .catch(function () {
                  btn.classList.remove('spinning');
                  alert('Refresh failed. Make sure you are running MDOnline.exe (not python -m http.server).');
                });
            });
          });
        },

        // --- Theme switcher ---
        function themeSwitcher(hook) {
          var STORAGE_KEY = 'docsify-theme';
          function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem(STORAGE_KEY, theme);
            updateButton(theme);
          }
          function updateButton(theme) {
            var btn = document.getElementById('theme-toggle');
            if (!btn) return;
            if (theme === 'light') {
              btn.className = 'icon-moon';
              btn.title = '\u5207\u6362\u4e3a\u6697\u9ed1\u6a21\u5f0f';
            } else {
              btn.className = 'icon-sun';
              btn.title = '\u5207\u6362\u4e3a\u6d45\u8272\u6a21\u5f0f';
            }
          }
          hook.mounted(function () {
            var btn = document.createElement('button');
            btn.id = 'theme-toggle';
            document.body.appendChild(btn);
            var saved = localStorage.getItem(STORAGE_KEY) || 'light';
            applyTheme(saved);
            btn.addEventListener('click', function () {
              var current = document.documentElement.getAttribute('data-theme') || 'light';
              applyTheme(current === 'dark' ? 'light' : 'dark');
            });
          });
          hook.doneEach(function () {
            var current = document.documentElement.getAttribute('data-theme') || 'light';
            updateButton(current);
          });
        },

        // --- PDF link interceptor: bypass Docsify hash routing ---
        function pdfLinkPlugin(hook) {
          hook.mounted(function () {
            function currentDocDir() {
              var basePath = window.$$docsifyBasePath || '/';
              var path = window.location.hash.replace(/^#\/?/, '/') || '/';
              path = path.split(/[?#]/)[0];
              if (!path.endsWith('/')) {
                path = path.substring(0, path.lastIndexOf('/') + 1) || '/';
              }
              return new URL(basePath.replace(/\/$/, '/') + path.replace(/^\/+/, ''), window.location.origin).pathname;
            }

            function resolveFromCurrentDoc(href) {
              return new URL(href, window.location.origin + currentDocDir()).pathname;
            }

            document.addEventListener('click', function (e) {
              var link = e.target.closest('a[href]');
              if (!link) return;
              var href = link.getAttribute('href');
              if (!href || !/\.pdf(?:[?#].*)?$/i.test(href)) return;
              e.preventDefault();
              e.stopPropagation();
              e.stopImmediatePropagation();
              var fileUrl;
              if (/^[a-z][a-z0-9+.-]*:/i.test(href) || href.startsWith('//')) {
                fileUrl = href;
              } else if (href.startsWith('/')) {
                fileUrl = href;
              } else if (href.startsWith('#')) {
                var hashPath = href.substring(1);
                fileUrl = hashPath.startsWith('/docs/')
                  ? hashPath
                  : resolveFromCurrentDoc(hashPath.replace(/^\/+/, ''));
              } else {
                fileUrl = resolveFromCurrentDoc(href);
              }
              window.open(fileUrl, '_blank', 'noopener');
            }, true);
          });
        }
      ]
    };
  </script>
</head>
<body>
  <div id="app">\u52a0\u8f7d\u6587\u6863\u4e2d...</div>
  <script src="./docsify.min.js"></script>
  <script src="./search.min.js"></script>
</body>
</html>

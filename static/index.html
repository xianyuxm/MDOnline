<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="MDOnline - Markdown docs site" />
  <title>MDOnline - Markdown docs site</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./vue.css" />
  <link rel="stylesheet" href="./style.css" />
  <script>
    (function () {
      var path = window.location.pathname;
      window.$$docsifyBasePath = path.replace(/(?:\/index\.html)?\/?$/, '/') || '/';
    })();

    window.$docsify = {
      name: 'MDOnline',
      basePath: window.$$docsifyBasePath,
      homepage: 'docs/README.md',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      coverpage: false,
      onlyCover: false,
      search: {
        paths: 'auto',
        maxAge: 0,
        depth: 4,
        noData: '\u6ca1\u6709\u627e\u5230\u76f8\u5173\u5185\u5bb9',
        placeholder: '\u641c\u7d22\u63a5\u53e3\u3001\u6d41\u7a0b\u3001\u72b6\u6001\u7801'
      },
      plugins: [
        function collapsibleSidebar(hook) {
          var STORAGE_KEY = 'docsify-sidebar-groups';
          var delegated = false;

          function groupKey(trigger) {
            return (trigger.textContent || '').trim();
          }

          function readState() {
            try {
              return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            } catch (e) {
              return {};
            }
          }

          function writeState(state) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          }

          function ensureTrigger(item, childList) {
            var trigger = item.querySelector(':scope > p, :scope > a');
            if (trigger) return trigger;

            var textNodes = [];
            item.childNodes.forEach(function (node) {
              if (node === childList) return;
              if (node.nodeType === Node.TEXT_NODE && node.textContent.trim()) {
                textNodes.push(node);
              }
            });
            if (!textNodes.length) return null;

            trigger = document.createElement('p');
            trigger.textContent = textNodes.map(function (node) {
              return node.textContent.trim();
            }).join(' ');
            item.insertBefore(trigger, childList);
            textNodes.forEach(function (node) {
              node.parentNode.removeChild(node);
            });
            return trigger;
          }

          function toggleGroup(trigger) {
            var item = trigger && trigger.parentElement;
            if (!item) return;
            var state = readState();
            item.classList.toggle('sidebar-group-collapsed');
            state[groupKey(trigger)] = item.classList.contains('sidebar-group-collapsed');
            writeState(state);
          }

          function bindDelegatedToggle() {
            if (delegated) return;
            delegated = true;
            document.addEventListener('click', function (event) {
              var trigger = event.target.closest('.sidebar-collapse-trigger');
              var nav = document.querySelector('.sidebar-nav');
              if (!trigger || !nav || !nav.contains(trigger)) return;
              event.preventDefault();
              event.stopPropagation();
              toggleGroup(trigger);
            }, true);
            document.addEventListener('keydown', function (event) {
              var trigger = event.target.closest && event.target.closest('.sidebar-collapse-trigger');
              var nav = document.querySelector('.sidebar-nav');
              if (!trigger || !nav || !nav.contains(trigger)) return;
              if (event.key !== 'Enter' && event.key !== ' ') return;
              event.preventDefault();
              event.stopPropagation();
              toggleGroup(trigger);
            }, true);
          }

          hook.doneEach(function () {
            bindDelegatedToggle();
            var savedState = readState();
            document.querySelectorAll('.sidebar-nav li').forEach(function (item) {
              var childList = item.querySelector(':scope > ul');
              var trigger = childList && ensureTrigger(item, childList);
              if (!childList || !trigger) { return; }
              trigger.classList.add('sidebar-collapse-trigger');
              trigger.setAttribute('role', 'button');
              trigger.setAttribute('tabindex', '0');
              if (savedState[groupKey(trigger)] === true) {
                item.classList.add('sidebar-group-collapsed');
              }
            });
          });
        },

        // --- IDEA-style sidebar pin/collapse + locate current page ---
        function sidebarDockPlugin(hook) {
          var COLLAPSE_KEY = 'docsify-sidebar-rail-collapsed';
          var dockReady = false;

          function isMobile() {
            return window.matchMedia('(max-width: 768px)').matches;
          }

          function getActiveLink() {
            return document.querySelector('.sidebar-nav li.active > a[href]');
          }

          function getActiveGroup(activeLink) {
            var node = activeLink && activeLink.parentElement;
            while (node && node.matches && node.matches('li')) {
              if (node.querySelector(':scope > .sidebar-collapse-trigger')) {
                return node;
              }
              var parentList = node.parentElement;
              node = parentList && parentList.closest('li');
            }
            return null;
          }

          function getActiveGroupName() {
            var activeLink = getActiveLink();
            var group = getActiveGroup(activeLink);
            var trigger = group && group.querySelector(':scope > .sidebar-collapse-trigger');
            return trigger ? (trigger.textContent || '').trim() : '目录';
          }

          function readGroupState() {
            try {
              return JSON.parse(localStorage.getItem('docsify-sidebar-groups') || '{}');
            } catch (e) {
              return {};
            }
          }

          function writeGroupState(state) {
            localStorage.setItem('docsify-sidebar-groups', JSON.stringify(state));
          }

          function updateRailLabel() {
            var label = document.getElementById('sidebar-rail-label');
            if (label) {
              label.textContent = getActiveGroupName();
              label.title = '当前分组：' + getActiveGroupName();
            }
          }

          function setCollapsed(collapsed) {
            if (isMobile()) {
              document.body.classList.remove('sidebar-rail-collapsed');
              return;
            }
            document.body.classList.toggle('sidebar-rail-collapsed', collapsed);
            localStorage.setItem(COLLAPSE_KEY, collapsed ? 'true' : 'false');
            var toggle = document.getElementById('sidebar-dock-toggle');
            if (toggle) {
              toggle.title = collapsed ? '展开导航' : '收起导航';
              toggle.setAttribute('aria-label', collapsed ? '展开导航' : '收起导航');
            }
          }

          function expandActiveGroup(activeLink) {
            var state = readGroupState();
            var node = activeLink && activeLink.parentElement;
            while (node && node.matches && node.matches('li')) {
              var trigger = node.querySelector(':scope > .sidebar-collapse-trigger');
              if (trigger) {
                node.classList.remove('sidebar-group-collapsed');
                state[(trigger.textContent || '').trim()] = false;
              }
              var parentList = node.parentElement;
              node = parentList && parentList.closest('li');
            }
            writeGroupState(state);
          }

          function collapseAllGroups() {
            var state = readGroupState();
            document.querySelectorAll('.sidebar-nav li').forEach(function (item) {
              var childList = item.querySelector(':scope > ul');
              var trigger = item.querySelector(':scope > .sidebar-collapse-trigger');
              if (!childList || !trigger) return;
              item.classList.add('sidebar-group-collapsed');
              state[(trigger.textContent || '').trim()] = true;
            });
            writeGroupState(state);
            updateRailLabel();
          }

          function locateCurrentPage(flash) {
            var activeLink = getActiveLink();
            if (!activeLink) {
              updateRailLabel();
              return;
            }
            expandActiveGroup(activeLink);
            if (!document.body.classList.contains('sidebar-rail-collapsed')) {
              activeLink.scrollIntoView({ block: 'center', behavior: 'smooth' });
            }
            if (flash) {
              activeLink.classList.remove('sidebar-current-flash');
              window.setTimeout(function () {
                activeLink.classList.add('sidebar-current-flash');
              }, 40);
            }
            updateRailLabel();
          }

          function ensureDockControls() {
            if (dockReady) return;
            dockReady = true;

            var toggle = document.createElement('button');
            toggle.id = 'sidebar-dock-toggle';
            toggle.type = 'button';
            toggle.title = '收起导航';
            toggle.setAttribute('aria-label', '收起导航');
            document.body.appendChild(toggle);
            toggle.addEventListener('click', function () {
              setCollapsed(!document.body.classList.contains('sidebar-rail-collapsed'));
            });

            var rail = document.createElement('div');
            rail.id = 'sidebar-rail';
            rail.innerHTML =
              '<button id="sidebar-rail-open" type="button" title="展开导航" aria-label="展开导航">☰</button>' +
              '<button id="sidebar-rail-label" type="button" title="当前分组">目录</button>';
            document.body.appendChild(rail);

            rail.querySelector('#sidebar-rail-open').addEventListener('click', function () {
              setCollapsed(false);
            });
            rail.querySelector('#sidebar-rail-label').addEventListener('click', function () {
              setCollapsed(false);
              window.setTimeout(function () { locateCurrentPage(true); }, 240);
            });
          }

          function ensureSidebarToolButtons() {
            var searchWrap = document.querySelector('.sidebar .search .input-wrap');
            if (!searchWrap) return;

            if (!document.getElementById('sidebar-locate-current')) {
              var locateBtn = document.createElement('button');
              locateBtn.id = 'sidebar-locate-current';
              locateBtn.type = 'button';
              locateBtn.title = '定位当前页';
              locateBtn.setAttribute('aria-label', '定位当前页');
              locateBtn.innerHTML = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="2"></circle><path d="M12 2v3"></path><path d="M12 19v3"></path><path d="M2 12h3"></path><path d="M19 12h3"></path></svg>';
              searchWrap.appendChild(locateBtn);
              locateBtn.addEventListener('click', function (event) {
                event.preventDefault();
                event.stopPropagation();
                setCollapsed(false);
                window.setTimeout(function () { locateCurrentPage(true); }, 240);
              });
            }

            if (!document.getElementById('sidebar-collapse-all')) {
              var collapseBtn = document.createElement('button');
              collapseBtn.id = 'sidebar-collapse-all';
              collapseBtn.type = 'button';
              collapseBtn.title = '收缩全部目录';
              collapseBtn.setAttribute('aria-label', '收缩全部目录');
              collapseBtn.innerHTML = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5 5 5-5"></path><path d="m7 9 5-5 5 5"></path><path d="M4 12h16"></path></svg>';
              searchWrap.appendChild(collapseBtn);
              collapseBtn.addEventListener('click', function (event) {
                event.preventDefault();
                event.stopPropagation();
                collapseAllGroups();
              });
            }
          }

          hook.mounted(function () {
            ensureDockControls();
            setCollapsed(localStorage.getItem(COLLAPSE_KEY) === 'true');
            window.addEventListener('resize', function () {
              setCollapsed(document.body.classList.contains('sidebar-rail-collapsed'));
            });
          });

          hook.doneEach(function () {
            ensureDockControls();
            ensureSidebarToolButtons();
            window.setTimeout(function () {
              locateCurrentPage(false);
            }, 80);
          });
        },

        // --- Action bar: Star + Donate ---
        function actionBarPlugin(hook) {
          var STAR_URL = 'https://github.com/xianyuxm/MDOnline';
          hook.mounted(function () {
            var bar = document.createElement('div');
            bar.id = 'action-bar';

            var starBtn = document.createElement('a');
            starBtn.id = 'action-star';
            starBtn.href = STAR_URL;
            starBtn.target = '_blank';
            starBtn.rel = 'noopener';
            starBtn.title = 'Star on GitHub';
            starBtn.innerHTML = '<svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor"><path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/></svg><span>Star</span>';
            bar.appendChild(starBtn);

            var donateBtn = document.createElement('button');
            donateBtn.id = 'action-donate';
            donateBtn.title = 'Buy me a coffee';
            donateBtn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span>Sponsor</span>';
            bar.appendChild(donateBtn);
            document.body.appendChild(bar);

            var modal = document.createElement('div');
            modal.id = 'donate-modal';
            modal.innerHTML =
              '<div class="donate-overlay"></div>' +
              '<div class="donate-content">' +
                '<button class="donate-close">&times;</button>' +
                '<h3>' + '\u611f\u8c22\u60a8\u7684\u652f\u6301\uff01' + '</h3>' +
                '<div class="donate-cards">' +
                  '<div class="donate-card">' +
                    '<img src="./images/wechat-pay.png" alt="' + '\u5fae\u4fe1\u652f\u4ed8' + '" />' +
                    '<p>' + '\u5fae\u4fe1\u652f\u4ed8' + '</p>' +
                  '</div>' +
                  '<div class="donate-card">' +
                    '<img src="./images/alipay.png" alt="' + '\u652f\u4ed8\u5b9d' + '" />' +
                    '<p>' + '\u652f\u4ed8\u5b9d' + '</p>' +
                  '</div>' +
                '</div>' +
              '</div>';
            document.body.appendChild(modal);

            var lightbox = document.createElement('div');
            lightbox.id = 'img-lightbox';
            lightbox.innerHTML =
              '<div class="lightbox-overlay"></div>' +
              '<img class="lightbox-img" src="" alt="" />' +
              '<button class="lightbox-close">&times;</button>';
            document.body.appendChild(lightbox);

            donateBtn.addEventListener('click', function () { modal.classList.add('open'); });
            modal.querySelector('.donate-overlay').addEventListener('click', function () { modal.classList.remove('open'); });
            modal.querySelector('.donate-close').addEventListener('click', function () { modal.classList.remove('open'); });
            document.addEventListener('keydown', function (e) {
              if (e.key === 'Escape') {
                if (lightbox.classList.contains('open')) { lightbox.classList.remove('open'); }
                else { modal.classList.remove('open'); }
              }
            });

            modal.querySelectorAll('.donate-card img').forEach(function (img) {
              img.style.cursor = 'zoom-in';
              img.addEventListener('click', function () {
                lightbox.querySelector('.lightbox-img').src = img.src;
                lightbox.querySelector('.lightbox-img').alt = img.alt;
                lightbox.classList.add('open');
              });
            });
            lightbox.querySelector('.lightbox-overlay').addEventListener('click', function () { lightbox.classList.remove('open'); });
            lightbox.querySelector('.lightbox-close').addEventListener('click', function () { lightbox.classList.remove('open'); });
          });
        },

        // --- Sidebar refresh button ---
        function sidebarRefreshPlugin(hook) {
          hook.mounted(function () {
            var btn = document.createElement('button');
            btn.id = 'sidebar-refresh';
            btn.title = 'Regenerate sidebar';
            btn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>';
            document.body.appendChild(btn);
            btn.addEventListener('click', function () {
              btn.classList.add('spinning');
              fetch('/__refresh')
                .then(function (res) { return res.text(); })
                .then(function () {
                  setTimeout(function () { btn.classList.remove('spinning'); location.reload(); }, 400);
                })
                .catch(function () {
                  btn.classList.remove('spinning');
                  alert('Refresh failed. Make sure you are running MDOnline.exe (not python -m http.server).');
                });
            });
          });
        },

        // --- Theme switcher ---
        function themeSwitcher(hook) {
          var STORAGE_KEY = 'docsify-theme';
          function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem(STORAGE_KEY, theme);
            updateButton(theme);
            if (window.renderMermaidDiagrams) {
              window.renderMermaidDiagrams(true);
            }
          }
          function updateButton(theme) {
            var btn = document.getElementById('theme-toggle');
            if (!btn) return;
            if (theme === 'light') {
              btn.className = 'icon-moon';
              btn.title = '\u5207\u6362\u4e3a\u6697\u9ed1\u6a21\u5f0f';
            } else {
              btn.className = 'icon-sun';
              btn.title = '\u5207\u6362\u4e3a\u6d45\u8272\u6a21\u5f0f';
            }
          }
          hook.mounted(function () {
            var btn = document.createElement('button');
            btn.id = 'theme-toggle';
            document.body.appendChild(btn);
            var saved = localStorage.getItem(STORAGE_KEY) || 'light';
            applyTheme(saved);
            btn.addEventListener('click', function () {
              var current = document.documentElement.getAttribute('data-theme') || 'light';
              applyTheme(current === 'dark' ? 'light' : 'dark');
            });
          });
          hook.doneEach(function () {
            var current = document.documentElement.getAttribute('data-theme') || 'light';
            updateButton(current);
          });
        },

        // --- Mermaid diagram renderer ---
        function mermaidPlugin(hook) {
          var renderId = 0;
          var viewer = null;
          var viewerStage = null;
          var viewerBaseScale = 1;
          var viewerUserScale = 1;
          var viewerX = 0;
          var viewerY = 0;
          var isDragging = false;
          var dragStartX = 0;
          var dragStartY = 0;
          var dragOriginX = 0;
          var dragOriginY = 0;

          function getTheme() {
            return (document.documentElement.getAttribute('data-theme') || 'light') === 'dark'
              ? 'dark'
              : 'default';
          }

          function getMermaidConfig(overrides) {
            var config = {
              startOnLoad: false,
              securityLevel: 'loose',
              theme: getTheme(),
              htmlLabels: false
            };
            if (overrides) {
              Object.keys(overrides).forEach(function (key) {
                config[key] = overrides[key];
              });
            }
            return config;
          }

          function getSvgNaturalSize(svg) {
            var viewBox = svg.viewBox && svg.viewBox.baseVal;
            if (viewBox && viewBox.width && viewBox.height) {
              return { width: viewBox.width, height: viewBox.height };
            }
            return {
              width: svg.width.baseVal.value || svg.getBoundingClientRect().width,
              height: svg.height.baseVal.value || svg.getBoundingClientRect().height
            };
          }

          function normalizeViewerSvg(svg) {
            svg.removeAttribute('style');
            var size = getSvgNaturalSize(svg);
            if (size.width && size.height) {
              svg.setAttribute('width', String(size.width));
              svg.setAttribute('height', String(size.height));
            }
            svg.style.maxWidth = 'none';
            svg.style.maxHeight = 'none';
          }

          function fitViewerToViewport() {
            var svg = viewerStage && viewerStage.querySelector('svg');
            if (!svg) return;
            var size = getSvgNaturalSize(svg);
            var maxW = window.innerWidth * 0.9;
            var maxH = window.innerHeight * 0.85;
            viewerBaseScale = Math.min(maxW / size.width, maxH / size.height);
            if (!isFinite(viewerBaseScale) || viewerBaseScale <= 0) {
              viewerBaseScale = 1;
            }
            viewerUserScale = 1;
            viewerX = 0;
            viewerY = 0;
            updateViewerTransform();
          }

          function updateViewerTransform() {
            if (!viewerStage) return;
            var scale = viewerBaseScale * viewerUserScale;
            viewerStage.style.transform = 'translate(' + viewerX + 'px, ' + viewerY + 'px) scale(' + scale + ')';
          }

          function resetViewerTransform() {
            fitViewerToViewport();
          }

          function closeViewer() {
            if (viewer) {
              viewer.classList.remove('open');
            }
            isDragging = false;
          }

          function zoomViewer(delta) {
            viewerUserScale = Math.max(0.25, Math.min(5, viewerUserScale + delta));
            updateViewerTransform();
          }

          function ensureViewer() {
            if (viewer) return;

            viewer = document.createElement('div');
            viewer.id = 'mermaid-viewer';
            viewer.innerHTML =
              '<div class="mermaid-viewer-backdrop"></div>' +
              '<div class="mermaid-viewer-toolbar">' +
                '<button class="mermaid-viewer-zoom-out" title="缩小">−</button>' +
                '<button class="mermaid-viewer-reset" title="适应屏幕">适应</button>' +
                '<button class="mermaid-viewer-zoom-in" title="放大">+</button>' +
                '<button class="mermaid-viewer-close" title="关闭">&times;</button>' +
              '</div>' +
              '<div class="mermaid-viewer-canvas">' +
                '<div class="mermaid-viewer-stage"></div>' +
              '</div>';
            document.body.appendChild(viewer);

            viewerStage = viewer.querySelector('.mermaid-viewer-stage');
            viewer.querySelector('.mermaid-viewer-backdrop').addEventListener('click', closeViewer);
            viewer.querySelector('.mermaid-viewer-close').addEventListener('click', closeViewer);
            viewer.querySelector('.mermaid-viewer-reset').addEventListener('click', resetViewerTransform);
            viewer.querySelector('.mermaid-viewer-zoom-in').addEventListener('click', function () { zoomViewer(0.25); });
            viewer.querySelector('.mermaid-viewer-zoom-out').addEventListener('click', function () { zoomViewer(-0.25); });

            viewer.querySelector('.mermaid-viewer-canvas').addEventListener('wheel', function (event) {
              event.preventDefault();
              var nextScale = viewerUserScale * (event.deltaY < 0 ? 1.12 : 0.88);
              viewerUserScale = Math.max(0.25, Math.min(5, nextScale));
              updateViewerTransform();
            }, { passive: false });

            viewer.querySelector('.mermaid-viewer-canvas').addEventListener('pointerdown', function (event) {
              if (event.target.closest('button')) return;
              isDragging = true;
              dragStartX = event.clientX;
              dragStartY = event.clientY;
              dragOriginX = viewerX;
              dragOriginY = viewerY;
              viewer.classList.add('dragging');
            });

            document.addEventListener('pointermove', function (event) {
              if (!isDragging) return;
              viewerX = dragOriginX + event.clientX - dragStartX;
              viewerY = dragOriginY + event.clientY - dragStartY;
              updateViewerTransform();
            });

            document.addEventListener('pointerup', function () {
              isDragging = false;
              if (viewer) {
                viewer.classList.remove('dragging');
              }
            });

            document.addEventListener('keydown', function (event) {
              if (event.key === 'Escape' && viewer.classList.contains('open')) {
                closeViewer();
              }
            });
          }

          function mountViewerSvg(svgHtml, bindFunctions) {
            viewerStage.innerHTML = svgHtml;
            var svg = viewerStage.querySelector('svg');
            if (!svg) return;
            if (bindFunctions) {
              bindFunctions(viewerStage);
            }
            normalizeViewerSvg(svg);
            fitViewerToViewport();
          }

          function openViewer(diagram) {
            var source = diagram.getAttribute('data-mermaid-source');
            var inlineSvg = diagram.querySelector('svg');
            if (!source && !inlineSvg) return;

            ensureViewer();
            viewer.classList.remove('open');
            viewerStage.innerHTML = '';

            if (source && window.mermaid) {
              window.mermaid.initialize(getMermaidConfig({ useMaxWidth: false }));
              var id = 'mermaid-viewer-' + (++renderId);
              Promise.resolve(window.mermaid.render(id, source))
                .then(function (result) {
                  mountViewerSvg(result.svg || result, result.bindFunctions);
                  viewer.classList.add('open');
                  window.mermaid.initialize(getMermaidConfig({ useMaxWidth: true }));
                })
                .catch(function () {
                  if (inlineSvg) {
                    mountViewerSvg(inlineSvg.outerHTML);
                    viewer.classList.add('open');
                  }
                  window.mermaid.initialize(getMermaidConfig({ useMaxWidth: true }));
                });
              return;
            }

            if (inlineSvg) {
              mountViewerSvg(inlineSvg.outerHTML);
              viewer.classList.add('open');
            }
          }

          function attachZoomButton(diagram) {
            if (diagram.querySelector('.mermaid-zoom-button')) return;
            var button = document.createElement('button');
            button.className = 'mermaid-zoom-button';
            button.type = 'button';
            button.title = '放大查看';
            button.innerHTML = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path><path d="M11 8v6"></path><path d="M8 11h6"></path></svg>';
            button.addEventListener('click', function () {
              openViewer(diagram);
            });
            diagram.appendChild(button);
          }

          function resetRenderedDiagrams() {
            document.querySelectorAll('.mermaid-diagram[data-mermaid-source]').forEach(function (diagram) {
              var pre = document.createElement('pre');
              var code = document.createElement('code');
              pre.setAttribute('data-lang', 'mermaid');
              code.className = 'lang-mermaid';
              code.textContent = diagram.getAttribute('data-mermaid-source') || '';
              pre.appendChild(code);
              diagram.replaceWith(pre);
            });
          }

          function renderMermaidDiagrams(force) {
            if (!window.mermaid) return;
            if (force) {
              resetRenderedDiagrams();
            }

            window.mermaid.initialize(getMermaidConfig({ useMaxWidth: true }));

            document.querySelectorAll('pre[data-lang="mermaid"]:not([data-mermaid-rendered]), code.lang-mermaid:not([data-mermaid-rendered])').forEach(function (node) {
              var pre = node.tagName.toLowerCase() === 'pre' ? node : node.closest('pre');
              var code = node.tagName.toLowerCase() === 'code' ? node : (pre && pre.querySelector('code'));
              if (!code) return;

              var source = code.textContent.trim();
              if (!source) return;

              if (pre) {
                pre.dataset.mermaidRendered = 'true';
              }
              code.dataset.mermaidRendered = 'true';

              var container = document.createElement('div');
              container.className = 'mermaid-diagram';
              container.setAttribute('data-mermaid-source', source);
              container.textContent = source;
              if (pre) {
                pre.replaceWith(container);
              } else {
                code.replaceWith(container);
              }

              var id = 'mermaid-diagram-' + (++renderId);
              Promise.resolve(window.mermaid.render(id, source))
                .then(function (result) {
                  container.innerHTML = result.svg || result;
                  if (result.bindFunctions) {
                    result.bindFunctions(container);
                  }
                  attachZoomButton(container);
                })
                .catch(function (err) {
                  container.classList.add('mermaid-diagram-error');
                  container.textContent = 'Mermaid render error: ' + (err && err.message ? err.message : err);
                });
            });
          }

          window.renderMermaidDiagrams = renderMermaidDiagrams;
          hook.doneEach(function () {
            renderMermaidDiagrams(false);
          });
        },

        // --- PDF link interceptor: bypass Docsify hash routing ---
        function pdfLinkPlugin(hook) {
          hook.mounted(function () {
            function currentDocDir() {
              var basePath = window.$$docsifyBasePath || '/';
              var path = window.location.hash.replace(/^#\/?/, '/') || '/';
              path = path.split(/[?#]/)[0];
              if (!path.endsWith('/')) {
                path = path.substring(0, path.lastIndexOf('/') + 1) || '/';
              }
              return new URL(basePath.replace(/\/$/, '/') + path.replace(/^\/+/, ''), window.location.origin).pathname;
            }

            function resolveFromCurrentDoc(href) {
              return new URL(href, window.location.origin + currentDocDir()).pathname;
            }

            document.addEventListener('click', function (e) {
              var link = e.target.closest('a[href]');
              if (!link) return;
              var href = link.getAttribute('href');
              if (!href || !/\.pdf(?:[?#].*)?$/i.test(href)) return;
              e.preventDefault();
              e.stopPropagation();
              e.stopImmediatePropagation();
              var fileUrl;
              if (/^[a-z][a-z0-9+.-]*:/i.test(href) || href.startsWith('//')) {
                fileUrl = href;
              } else if (href.startsWith('/')) {
                fileUrl = href;
              } else if (href.startsWith('#')) {
                var hashPath = href.substring(1);
                fileUrl = hashPath.startsWith('/docs/')
                  ? hashPath
                  : resolveFromCurrentDoc(hashPath.replace(/^\/+/, ''));
              } else {
                fileUrl = resolveFromCurrentDoc(href);
              }
              window.open(fileUrl, '_blank', 'noopener');
            }, true);
          });
        }
      ]
    };
  </script>
